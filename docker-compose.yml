version: '3.8'

services:
  onchain:
    image: trufflesuite/ganache:latest
    ports:
      - "7545:7545"
    volumes:
      - ./onchain/ganache_db:/app/ganache_db
    command: >
      -p 7545 
      --db /app/ganache_db 
      --mnemonic "test test test test test test test test test test test junk"
      --host 0.0.0.0

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PROVIDER_URL=http://onchain:7545
      - REGISTRY_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
    depends_on:
      - onchain
    volumes:
      - ./server/data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/admin
      - VITE_PROVIDER_URL=http://localhost:7545
      - VITE_TRUST_REGISTRY_TRUST_REGISTRY_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
      - VITE_IDENTITY_VAULT_ADDRESS=0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0
    depends_on:
      - server
