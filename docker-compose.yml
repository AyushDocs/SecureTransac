services:
  ganache:
    image: trufflesuite/ganache:latest
    ports:
      - "7545:7545"
    volumes:
      - ganache_db:/app/ganache_db
    command: >
      -p 7545
      --db /app/ganache_db
      --mnemonic "test test test test test test test test test test test junk"
      --chain.chainId 1337
      --chain.networkId 1337
      --host 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7545"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - PROVIDER_URL=http://ganache:7545
      - PROVIDER_WS=${PROVIDER_WS:-ws://ganache:7545}
      - REGISTRY_ADDRESS=${REGISTRY_ADDRESS:-0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512}
      - VAULT_ADDRESS=${VAULT_ADDRESS:-0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9}
      - VERIFICATION_ADDRESS=${VERIFICATION_ADDRESS:-0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9}
      - NETWORK_ID=${NETWORK_ID:-1337}
      - ADMIN_PRIVATE_KEY=${ADMIN_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      - ADMIN_ADDRESS=${ADMIN_ADDRESS:-0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266}
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - PINATA_JWT=${PINATA_JWT:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      ganache:
        condition: service_healthy
    volumes:
      - server_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  ganache_db:
  server_data: